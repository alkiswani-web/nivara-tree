<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🌳 Nivara — تحدث مع الشجرة</title>
  <style>
    body{font-family:system-ui;background:#f4f7f5;max-width:780px;margin:28px auto;padding:14px;}
    .card{background:#fff;border:1px solid #e6e6e6;border-radius:16px;padding:16px;box-shadow:0 6px 18px rgba(0,0,0,0.06);}
    .header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
    .title{display:flex;align-items:center;gap:10px;}
    .tree{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:#e6f2ec;font-size:24px;}
    h2{margin:0;font-size:20px}
    .sub{margin:0;color:#666;font-size:13px}
    .chat{background:#f7faf8;border:1px solid #e8eeea;border-radius:14px;padding:12px;height:300px;overflow:auto;white-space:pre-wrap;}
    .msg{margin:10px 0;line-height:1.5;}
    .me{color:#111}
    .bot{color:#0b5}
    .meta{margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
    .chip{display:inline-block;padding:3px 8px;border-radius:999px;font-size:12px;border:1px solid #ddd;background:#fff;}
    .chip.advice{border-color:#0b5;}
    .chip.warning{border-color:#d33;}
    .chip.info{border-color:#369;}
    .chip.answer{border-color:#888;}
    .why{font-size:12px;color:#555;background:#fff;border:1px dashed #ddd;border-radius:10px;padding:8px;}
    .row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:center;}
    input[type="text"]{flex:1;min-width:220px;padding:12px;font-size:16px;border-radius:12px;border:1px solid #d7dfda;outline:none;}
    input[type="file"]{width:100%;margin-top:10px;}
    button{padding:12px 14px;border:0;border-radius:12px;cursor:pointer;font-size:15px;}
    .btn-main{background:#0b5;color:#fff}
    .btn-ghost{background:#eef3f0}
    select{padding:10px;border-radius:12px;border:1px solid #d7dfda;background:#fff;}
    label{font-size:13px;color:#444;display:flex;gap:8px;align-items:center;}
    .hint{color:#666;font-size:12px;margin-top:10px}
  </style>
</head>

<body>
  <div class="card">
    <div class="header">
      <div class="title">
        <div class="tree">🌳</div>
        <div>
          <h2>Nivara — تحدث مع الشجرة</h2>
          <p class="sub">Context Mode + Highlights + Explainable AI + Vision</p>
        </div>
      </div>

      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn-ghost" onclick="stopSpeak()">إيقاف الصوت</button>
        <button class="btn-ghost" onclick="clearChat()">مسح المحادثة</button>
        <button class="btn-ghost" onclick="resetMemory()">Reset ذاكرة السيرفر</button>
      </div>
    </div>

    <div class="row" style="margin-top:0">
      <select id="mode">
        <option value="general">🌳 عام</option>
        <option value="teach">🌱 تعليمي</option>
        <option value="eco">🌿 بيئي/زراعي</option>
        <option value="coach">🧠 إرشادي</option>
      </select>

      <label>
        <input type="checkbox" id="explain" />
        Explain (ليش الرد؟)
      </label>
    </div>

    <div id="chat" class="chat"></div>

    <div class="row">
      <input id="msg" type="text" placeholder="اكتب كلامك هنا..." onkeydown="if(event.key==='Enter'){talk()}" />
      <button class="btn-main" onclick="talk()">احكي 🌿</button>
    </div>

    <div style="margin-top:12px">
      <input type="file" id="imageInput" accept="image/*" />
      <div class="row">
        <button class="btn-ghost" onclick="sendImage()">حلّل الصورة 📷</button>
      </div>
    </div>

    <div class="hint">
      جرّب تبدّل الوضع ثم اسأل نفس السؤال وشوف كيف الرد يتغير فورًا ✅  
      
    </div>
  </div>

<script>
  const chatEl = document.getElementById("chat");
  const inputEl = document.getElementById("msg");
  const fileEl  = document.getElementById("imageInput");
  const modeEl  = document.getElementById("mode");
  const explainEl = document.getElementById("explain");

  const key = "nivara_chat_v3";
  const chat = JSON.parse(localStorage.getItem(key) || "[]");

  function render(){
    chatEl.textContent = "";
    for (const m of chat){
      const wrap = document.createElement("div");
      wrap.className = "msg " + (m.role === "me" ? "me" : "bot");

      const text = document.createElement("div");
      text.textContent = (m.role === "me" ? "أنا: " : "Nivara: ") + m.text;
      wrap.appendChild(text);

      if(m.role === "bot"){
        const meta = document.createElement("div");
        meta.className = "meta";

        if(m.tag){
          const chip = document.createElement("span");
          chip.className = "chip " + m.tag;
          chip.textContent =
            m.tag === "advice" ? "🌱 نصيحة" :
            m.tag === "warning" ? "⚠️ تحذير" :
            m.tag === "info" ? "ℹ️ معلومة" :
            "✅ إجابة";
          meta.appendChild(chip);
        }

        if(m.mode){
          const chip2 = document.createElement("span");
          chip2.className = "chip";
          chip2.textContent =
            m.mode === "teach" ? "وضع: تعليمي" :
            m.mode === "eco" ? "وضع: بيئي" :
            m.mode === "coach" ? "وضع: إرشادي" : "وضع: عام";
          meta.appendChild(chip2);
        }

        wrap.appendChild(meta);

        if(m.why){
          const why = document.createElement("div");
          why.className = "why";
          why.textContent = "💡 لماذا هذا الرد؟ " + m.why;
          wrap.appendChild(why);
        }
      }

      chatEl.appendChild(wrap);
    }
    chatEl.scrollTop = chatEl.scrollHeight;
    localStorage.setItem(key, JSON.stringify(chat));
  }

  function stopSpeak(){ speechSynthesis.cancel(); }

  function speak(text){
    stopSpeak();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = "ar-JO";
    utter.rate = 0.9;
    utter.pitch = 1;
    speechSynthesis.speak(utter);
  }

  function clearChat(){
    stopSpeak();
    chat.length = 0;
    render();
  }

  async function resetMemory(){
    try{
      await fetch("/reset");
      chat.push({ role:"bot", text:"✅ مسحت ذاكرة السيرفر (السياق)", tag:"info", why:"", mode:modeEl.value });
      render();
    }catch{
      chat.push({ role:"bot", text:"❌ ما قدرت أمسح ذاكرة السيرفر", tag:"warning", why:"", mode:modeEl.value });
      render();
    }
  }

  async function talk(){
    const text = inputEl.value.trim();
    if(!text) return;

    const mode = modeEl.value;
    const explain = explainEl.checked ? "1" : "0";

    chat.push({ role:"me", text, mode });
    render();
    inputEl.value = "";

    const res = await fetch(`/talk?msg=${encodeURIComponent(text)}&mode=${encodeURIComponent(mode)}&explain=${explain}`);
    const data = await res.json();

    chat.push({ role:"bot", text: data.reply, tag: data.tag, why: data.why, mode });
    render();
    speak(data.reply);
  }

  async function sendImage(){
    if(!fileEl.files.length){
      alert("ارفع صورة أولاً");
      return;
    }

    const mode = modeEl.value;
    const explain = explainEl.checked ? "1" : "0";
    const file = fileEl.files[0];

    chat.push({ role:"me", text: "📷 رفعت صورة: " + file.name, mode });
    render();

    const dataUrl = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error("File read failed"));
      reader.readAsDataURL(file);
    });

    const res = await fetch("/vision", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ image: dataUrl, mode, explain })
    });

    const data = await res.json();
    chat.push({ role:"bot", text: data.reply, tag: data.tag, why: data.why, mode });
    render();
    speak(data.reply);
  }

  render();
</script>
</body>
</html>
